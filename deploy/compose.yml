x-service: &service
  restart: ${RESTART_POLICY:-unless-stopped}
  read_only: true
  tmpfs:
    - /run:size=16M,mode=1750,exec
    - /tmp:size=16M,mode=1777,noexec
  env_file:
    - .env
    - secrets.env
  networks:
    meet.jitsi:

services:
  web:
    <<: *service
    image: ${MEET_IMAGE_REPO:-ghcr.io/nowshad7}/meet-web:${MEET_VERSION:?set MEET_VERSION in .env}
    env_file:
      - .env
    ports:
      - "${HTTP_PORT:-80}:8000"
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      - ${CONFIG:-./data}/web:/config:Z
      - ${CONFIG:-./data}/storage/web:/storage:Z
      - ${CONFIG:-./data}/storage/transcripts:/usr/share/jitsi-meet/transcripts:ro,z
      - ${CONFIG:-./data}/tmp/web-load-test:/usr/share/jitsi-meet/load-test:Z
      - ./brand:/meet/brand:ro
    depends_on:
      - jvb

  prosody:
    <<: *service
    image: ${MEET_IMAGE_REPO:-ghcr.io/nowshad7}/meet-prosody:${MEET_VERSION:?set MEET_VERSION in .env}
    expose:
      - "5222"
      - "5269"
      - "5347"
      - "5280"
    ports:
      - "${MEET_CONTROL_BIND:-127.0.0.1}:${MEET_CONTROL_PORT:-5280}:5280"
    environment:
      # The caption permission gate is always loaded; it denies every request
      # unless ENABLE_TRANSCRIPTIONS=1 and the room's token entitles it.
      - XMPP_MUC_MODULES=${XMPP_MUC_MODULES:-},meet_transcription
      # Breakout rooms use the same verified-token caption entitlement gate.
      - XMPP_BREAKOUT_MUC_MODULES=${XMPP_BREAKOUT_MUC_MODULES:-},meet_transcription
      - MEET_TRANSCRIPTION_ENABLED=${ENABLE_TRANSCRIPTIONS:-0}
      # Saved transcripts are off unless .env sets MEET_TRANSCRIPTS=1; the spool
      # lives in the Prosody data volume below (/var/lib/prosody/meet-transcripts).
      - MEET_TRANSCRIPTS=${MEET_TRANSCRIPTS:-0}
      - MEET_TRANSCRIPT_RETRY_HOURS=${MEET_TRANSCRIPT_RETRY_HOURS:-24}
      - MEET_TRANSCRIPT_KEEP_DAYS=${MEET_TRANSCRIPT_KEEP_DAYS:-7}
    healthcheck:
      # With captions on, also wait until upstream has registered both Jigasi
      # accounts, so the transcriber's first login does not race them.
      test:
        - CMD-SHELL
        - >-
          curl -fsS -o /dev/null http://127.0.0.1:5280/health && case "$${ENABLE_TRANSCRIPTIONS:-0}" in
          1|true|TRUE|True)
          prosodyctl --config /run/prosody/config/prosody.cfg.lua shell user list "$${XMPP_AUTH_DOMAIN:-auth.meet.jitsi}"
          | grep -qxF "$${JIGASI_XMPP_USER:-jigasi}@$${XMPP_AUTH_DOMAIN:-auth.meet.jitsi}"
          && prosodyctl --config /run/prosody/config/prosody.cfg.lua shell user list "$${XMPP_HIDDEN_DOMAIN:-hidden.meet.jitsi}"
          | grep -qxF "$${JIGASI_TRANSCRIBER_USER:-transcriber}@$${XMPP_HIDDEN_DOMAIN:-hidden.meet.jitsi}" ;;
          esac
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - ${CONFIG:-./data}/prosody/config:/config:Z
      - ${CONFIG:-./data}/prosody/prosody-plugins-custom:/prosody-plugins-custom:Z
      - ${CONFIG:-./data}/storage/prosody:/var/lib/prosody:Z
    networks:
      meet.jitsi:
        aliases:
          - ${XMPP_SERVER:-xmpp.meet.jitsi}

  jicofo:
    <<: *service
    image: ${MEET_IMAGE_REPO:-ghcr.io/nowshad7}/meet-jicofo:${MEET_VERSION:?set MEET_VERSION in .env}
    environment:
      - SENTRY_DSN=${JICOFO_SENTRY_DSN:-0}
    ports:
      - "127.0.0.1:${JICOFO_REST_PORT:-8888}:8888"
    volumes:
      - ${CONFIG:-./data}/jicofo:/config:Z
    depends_on:
      - prosody

  jvb:
    <<: *service
    tmpfs:
      - /run:size=64M,mode=1750,exec
      - /tmp:size=16M,mode=1777,noexec
    image: ${MEET_IMAGE_REPO:-ghcr.io/nowshad7}/meet-jvb:${MEET_VERSION:?set MEET_VERSION in .env}
    environment:
      - SENTRY_DSN=${JVB_SENTRY_DSN:-0}
    ports:
      - "${JVB_PORT:-10000}:${JVB_PORT:-10000}/udp"
      - "127.0.0.1:${JVB_COLIBRI_PORT:-8080}:8080"
    volumes:
      - ${CONFIG:-./data}/jvb:/config:Z
    depends_on:
      - prosody

  jibri:
    <<: *service
    image: ${MEET_IMAGE_REPO:-ghcr.io/nowshad7}/meet-jibri:${MEET_VERSION:?set MEET_VERSION in .env}
    profiles:
      - recording
    tmpfs:
      - /run:size=256M,mode=1750,exec
      - /tmp:size=256M,mode=1777,noexec
    shm_size: 2gb
    environment:
      - DISPLAY=:0
    volumes:
      - ${CONFIG:-./data}/jibri:/config:Z
      - ${CONFIG:-./data}/storage/jibri:/storage:Z
    depends_on:
      - jicofo

  # Live captions (docs/features/transcription.md): COMPOSE_PROFILES=transcription
  # and ENABLE_TRANSCRIPTIONS=1. The gateway alone reads the provider keys.
  stt-gateway:
    image: ${MEET_IMAGE_REPO:-ghcr.io/nowshad7}/meet-stt-gateway:${MEET_VERSION:?set MEET_VERSION in .env}
    profiles:
      - transcription
    restart: ${RESTART_POLICY:-unless-stopped}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      - .env
      - stt-secrets.env
    environment:
      - MEET_STT_PROVIDER_MODULE=${MEET_STT_PROVIDER_MODULE:-/app/gemini-transcribe-live.mjs}
    networks:
      meet.jitsi:

  transcriber:
    <<: *service
    image: ${MEET_IMAGE_REPO:-ghcr.io/nowshad7}/meet-jigasi:${MEET_VERSION:?set MEET_VERSION in .env}
    profiles:
      - transcription
    tmpfs:
      - /run:size=16M,mode=1750,exec
      - /tmp:size=128M,mode=1777,noexec
    # Live captions only: no transcript files, audio recording or translation.
    environment:
      - JIGASI_MODE=transcriber
      - JIGASI_TRANSCRIBER_CUSTOM_SERVICE=org.jitsi.jigasi.transcription.WhisperTranscriptionService
      - JIGASI_TRANSCRIBER_WHISPER_URL=ws://stt-gateway:8000/streaming-whisper/ws
      - JIGASI_TRANSCRIBER_ENABLE_SAVING=false
      - JIGASI_TRANSCRIBER_RECORD_AUDIO=false
      - JIGASI_TRANSCRIBER_ADVERTISE_URL=false
      - JIGASI_TRANSCRIBER_ENABLE_TRANSLATION=false
      - SENTRY_DSN=${JIGASI_SENTRY_DSN:-0}
    volumes:
      - ${CONFIG:-./data}/transcriber:/config:Z
      - ${CONFIG:-./data}/storage/transcripts:/tmp/transcripts:z
    depends_on:
      prosody:
        condition: service_healthy
      stt-gateway:
        condition: service_healthy

  app-proxy:
    image: ${MEET_IMAGE_REPO:-ghcr.io/nowshad7}/meet-app-proxy:${MEET_VERSION:?set MEET_VERSION in .env}
    profiles:
      - app-proxy
    restart: ${RESTART_POLICY:-unless-stopped}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MEET_APP_PROXY_HOST
    networks:
      meet.jitsi:
        aliases:
          - ${MEET_APP_PROXY_ALIAS:-app.internal}

networks:
  meet.jitsi:
