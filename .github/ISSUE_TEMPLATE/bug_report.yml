name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please remove secrets, tokens and private host names from everything you paste.
        Security problems go through private reporting instead, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps, ideally starting from the localhost example deployment.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Deployment
      description: Output of `scripts/meet env <name>` (it never prints secrets) and the release tag or commit you run.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `scripts/meet logs <name> prosody jicofo jvb`, `scripts/meet health <name>` and `tests/stack-check.sh <name>`.
      render: text
