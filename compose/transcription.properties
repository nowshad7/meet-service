# Live captions only; explicit values override Jigasi publisher defaults.
org.jitsi.jigasi.transcription.SAVE_TXT=false
org.jitsi.jigasi.transcription.SAVE_JSON=false
org.jitsi.jigasi.transcription.RECORD_AUDIO=false
org.jitsi.jigasi.transcription.ADVERTISE_URL=false
org.jitsi.jigasi.transcription.ENABLE_TRANSLATION=false
# meet-jigasi only: milliseconds of each speaker's audio collected before it is
# sent on (stock Jigasi holds about 1.5 s at 16 kHz). 0 sends every 20 ms packet.
org.jitsi.jigasi.transcription.AUDIO_BUFFER_MS=100
