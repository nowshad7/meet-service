# Added by scripts/meet only with transcription opt-in AND a provider module.
services:
  stt-gateway:
    image: ${MEET_STT_GATEWAY_IMAGE:-meet.local/meet-stt-gateway:dev}
    build:
      context: ${MEET_ROOT}
      dockerfile: services/stt-gateway/Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      - MEET_STT_PROVIDER_MODULE
      - MEET_STT_LOG
      - MEET_STT_PREWARM_LANGUAGE
      - GEMINI_API_KEY
      - GEMINI_TRANSCRIBE_MODEL
      - GEMINI_TRANSCRIBE_MAX_QUEUE_MS
      - GEMINI_TRANSCRIBE_SETUP_TIMEOUT_MS
      - GEMINI_TRANSCRIBE_RECONNECT_MS
      - GEMINI_TRANSCRIBE_SESSION_MS
      - GEMINI_TRANSCRIBE_DRAIN_MS
      - GEMINI_TRANSCRIBE_SPARE_MS
      - GEMINI_TRANSCRIBE_MAX_STREAMS
      - ELEVENLABS_API_KEY
      - ELEVENLABS_MODEL
      - ELEVENLABS_MAX_QUEUE_MS
      - ELEVENLABS_SETUP_TIMEOUT_MS
      - ELEVENLABS_RECONNECT_MS
      - ELEVENLABS_SPARE_MS
      - ELEVENLABS_MAX_STREAMS
      - GEMINI_MODEL
      - GEMINI_TIMEOUT_MS
      - GEMINI_LIVE_MODEL
      - GEMINI_LIVE_MAX_QUEUE_MS
      - GEMINI_LIVE_SETUP_TIMEOUT_MS
      - GEMINI_LIVE_STALL_MS
      - GEMINI_LIVE_RECONNECT_MS
      - GEMINI_LIVE_FINAL_GRACE_MS
      - GEMINI_LIVE_SESSION_MS
      - GEMINI_LIVE_MAX_STREAMS
      - GEMINI_LIVE_MAX_OUTPUT_TOKENS
      - MEET_STT_WINDOW_MS
      - MEET_STT_OVERLAP_MS
      - MEET_STT_IDLE_MS
      - MEET_STT_STREAM_IDLE_MS
      - MEET_STT_TIMEOUT_MS
      - MEET_STT_MAX_ACTIVE_CALLS
      - MEET_STT_MAX_QUEUE
      - MEET_STT_MAX_SPEAKERS
      - MEET_STT_MAX_CONNECTIONS
    networks:
      meet.jitsi:
    # Internal-only: no host port; provider credentials are injected only at runtime.
  transcriber:
    depends_on:
      stt-gateway:
        condition: service_healthy
